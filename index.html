<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>JOANDRA — Financial Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#161B22;
  --ink-soft:#3A4250;
  --slate:#6B7280;
  --cream:#F6F3EC;
  --paper:#FFFFFF;
  --line:#E7E1D4;
  --gold:#B8892B;
  --gold-soft:#EFE1BE;
  --green:#3E7C59;
  --green-soft:#E1EEE5;
  --terracotta:#BF4E30;
  --terracotta-soft:#F6E1DA;
  --navy:#1B2A41;
  --radius:16px;
  --radius-sm:10px;
  --shadow: 0 1px 2px rgba(22,27,34,.04), 0 8px 24px -12px rgba(22,27,34,.18);
  --font-display:'Fraunces', serif;
  --font-body:'Manrope', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
[data-theme="dark"]{
  --ink:#EAEAEF;
  --ink-soft:#C7CCD6;
  --slate:#8A93A6;
  --cream:#12151C;
  --paper:#1A1E27;
  --line:#2A3040;
  --gold:#D7AE5C;
  --gold-soft:#3A311E;
  --green:#5FBE87;
  --green-soft:#173325;
  --terracotta:#E17A5B;
  --terracotta-soft:#3A2019;
  --navy:#3C5378;
}
[data-theme="dark"] body{background:var(--cream);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:16px;}
::selection{background:var(--gold-soft);}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--cream);
  position:relative;
  display:flex;
  flex-direction:column;
  padding-bottom:84px;
}

/* ============ HEADER ============ */
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--cream);
  padding:18px 18px 10px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid transparent;
}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand-mark{
  font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:0.5px;
  color:var(--navy);
}
.brand-sub{font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold); font-weight:600;}
.topbar-actions{display:flex; align-items:center; gap:8px;}
.streak-pill{
  display:flex; align-items:center; gap:5px;
  background:var(--paper); border:1px solid var(--line);
  border-radius:999px; padding:6px 12px 6px 9px;
  font-weight:700; font-size:13px; color:var(--terracotta);
  box-shadow:var(--shadow);
}
.streak-pill .flame{font-size:15px; filter:saturate(1.3);}
.icon-btn{
  width:36px; height:36px; border-radius:999px; border:1px solid var(--line);
  background:var(--paper); display:flex; align-items:center; justify-content:center;
  font-size:16px; box-shadow:var(--shadow); color:var(--ink-soft);
}

/* ============ MAIN ============ */
.view{padding:6px 18px 24px;}
.hidden{display:none !important;}

.section-title{
  font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--navy);
  margin:22px 0 12px; display:flex; align-items:center; justify-content:space-between;
}
.section-title .link{font-family:var(--font-body); font-size:12.5px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:0.5px;}

/* Balance cards */
.ledger{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;
}
.ledger-card{
  border-radius:var(--radius); padding:16px 16px 14px; position:relative; overflow:hidden;
  box-shadow:var(--shadow);
}
.ledger-card.income{background:var(--green); color:#fff;}
.ledger-card.expense{background:var(--terracotta); color:#fff;}
.ledger-label{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; font-weight:700; opacity:.7;}
.ledger-amount{font-family:var(--font-mono); font-size:20px; font-weight:700; margin-top:8px; letter-spacing:-0.3px;}
.ledger-card.income .ledger-amount{color:#fff;}
.ledger-card.expense .ledger-amount{color:#fff;}
.cycle-label{font-size:11.5px; color:var(--slate); margin-top:10px; font-weight:600;}
.greeting-block{margin:8px 0 16px;}
.greeting-text{font-family:var(--font-display); font-size:23px; font-weight:600; color:var(--navy);}
.greeting-sub{font-size:12.5px; color:var(--slate); margin-top:3px;}

/* list rows */
.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.row{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row-icon{
  width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto;
}
.row-main{flex:1; min-width:0;}
.row-title{font-weight:700; font-size:14px; color:var(--ink);}
.row-sub{font-size:12px; color:var(--slate); margin-top:2px;}
.row-amount{font-family:var(--font-mono); font-weight:700; font-size:13.5px; white-space:nowrap;}
.row-amount.pos{color:var(--green);}
.row-amount.neg{color:var(--terracotta);}
.empty-state{padding:22px 14px; text-align:center; color:var(--slate); font-size:13px;}

/* FAB */
.fab{
  position:fixed; right:calc(50% - 240px + 18px); bottom:92px; z-index:40;
  width:56px; height:56px; border-radius:999px; border:none;
  background:var(--navy); color:var(--gold-soft); font-size:26px; font-weight:400;
  box-shadow:0 10px 24px -6px rgba(27,42,65,.55);
  display:flex; align-items:center; justify-content:center;
}
@media (max-width:520px){ .fab{right:18px;} }
.fab:active{transform:scale(0.94);}

/* Bottom nav */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:35;
  max-width:480px; margin:0 auto;
  background:var(--paper); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.navbtn{
  background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--slate); font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
  padding:4px 8px; border-radius:10px;
}
.navbtn .ic{font-size:18px;}
.navbtn.active{color:var(--navy);}
.navbtn.active .ic{color:var(--gold);}
.navbtn.center{
  width:54px; height:54px; border-radius:50%; background:var(--navy); color:var(--gold-soft);
  margin-top:-26px; box-shadow:0 10px 22px -6px rgba(27,42,65,.55); border:4px solid var(--cream);
  justify-content:center;
}
.navbtn.center .ic{font-size:21px;}
.navbtn.center.active{background:var(--gold); border-color:var(--cream);}
.navbtn.center.active .ic{color:#fff;}

/* Modal */
.overlay{
  position:fixed; inset:0; background:rgba(22,20,16,.45); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(2px);
}
.overlay.hidden{display:none;}
.sheet{
  width:100%; max-width:480px; background:var(--cream); border-radius:22px 22px 0 0;
  max-height:92vh; overflow-y:auto; padding:8px 18px 28px;
  animation:slideup .22s ease-out;
}
@keyframes slideup{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:99px; margin:8px auto 14px;}
.sheet-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
.sheet-topbar .sheet-handle{flex:1; margin:0 auto;}
.sheet-close{
  width:34px; height:34px; border-radius:999px; border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink-soft); flex:0 0 auto;
}
.sheet-close:active{transform:scale(0.94);}
.sheet-title{font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--navy); margin:0 0 14px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--slate); margin-bottom:6px;}
.field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{
  width:100%; padding:12px 13px; border-radius:11px; border:1px solid var(--line); background:var(--paper); color:var(--ink); outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold);}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.row-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.typegroup{display:flex; gap:8px; margin-bottom:14px;}
.typegroup button{flex:1; padding:11px; border-radius:11px; border:1px solid var(--line); background:var(--paper); font-weight:700; font-size:13.5px; color:var(--slate);}
.typegroup button.on.inc{background:var(--green-soft); border-color:var(--green); color:var(--green);}
.typegroup button.on.exp{background:var(--terracotta-soft); border-color:var(--terracotta); color:var(--terracotta);}

.amount-display{
  font-family:var(--font-mono); font-size:30px; font-weight:700; text-align:right; padding:10px 4px;
  color:var(--ink); border-bottom:2px solid var(--line); margin-bottom:10px; word-break:break-all;
}
.calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
.calc-grid button{
  padding:14px 0; border-radius:11px; border:1px solid var(--line); background:var(--paper); font-weight:700; font-size:16px; color:var(--ink);
}
.calc-grid button.op{background:var(--navy); color:var(--gold-soft); border-color:var(--navy);}
.calc-grid button.clear{color:var(--terracotta);}
.calc-grid button.eq{background:var(--gold); color:#fff; border-color:var(--gold); grid-column:span 2;}

.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.chip{padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--paper); font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}
.chip.add{border-style:dashed; color:var(--gold);}

.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 2px; margin-bottom:10px;}
.toggle-row span{font-weight:700; font-size:13.5px;}
.switch{width:42px; height:24px; border-radius:99px; background:var(--line); position:relative; border:none;}
.switch.on{background:var(--gold);}
.switch::after{content:''; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:99px; background:#fff; transition:.15s;}
.switch.on::after{left:20px;}

.btn{width:100%; padding:14px; border-radius:12px; border:none; background:var(--navy); color:#fff; font-weight:700; font-size:14.5px; margin-top:6px;}
.btn.secondary{background:var(--paper); color:var(--terracotta); border:1px solid var(--terracotta-soft);}
.btn.ghost{background:transparent; color:var(--slate); border:1px solid var(--line);}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}

/* Tabs within subpages */
.tabbar{display:flex; gap:8px; margin-bottom:14px;}
.tabbar button{flex:1; padding:9px; border-radius:11px; border:1px solid var(--line); background:var(--paper); font-weight:700; font-size:12.5px; color:var(--slate);}
.tabbar button.on{background:var(--navy); color:#fff; border-color:var(--navy);}

/* Chart wheel */
.chart-wrap{position:relative; width:200px; height:200px; margin:6px auto 4px;}
.chart-wrap svg{display:block; margin:0 auto;}
.chart-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;}
.chart-center .amt{font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--navy);}
.chart-center .lbl{font-size:9.5px; text-transform:uppercase; letter-spacing:1px; color:var(--slate); margin-top:2px;}

.cat-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line);}
.cat-row:last-child{border-bottom:none;}
.cat-dot{width:11px; height:11px; border-radius:3px; flex:0 0 auto;}
.cat-row-main{flex:1;}
.cat-row-name{font-weight:700; font-size:13.5px;}
.cat-row-pct{font-size:11px; color:var(--slate);}
.cat-row-amt{font-family:var(--font-mono); font-weight:700; font-size:13px;}

/* Todo & events */
.todo-row{display:flex; align-items:center; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line);}
.todo-row:last-child{border-bottom:none;}
.check{width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;}
.check.done{background:var(--green); border-color:var(--green);}
.todo-title{font-weight:700; font-size:13.5px;}
.todo-title.done{text-decoration:line-through; color:var(--slate);}
.todo-sub{font-size:11.5px; color:var(--slate); margin-top:2px;}

.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.cal-head .m{font-family:var(--font-display); font-weight:600; font-size:16.5px; color:var(--navy);}
.cal-nav{display:flex; gap:6px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
.cal-dow{font-size:9.5px; color:var(--slate); font-weight:700; padding-bottom:4px;}
.cal-cell{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:9px; font-size:12px; position:relative; color:var(--ink-soft);}
.cal-cell.today{background:var(--navy); color:#fff; font-weight:700;}
.cal-cell.blank{visibility:hidden;}
.cal-dot{width:4px; height:4px; border-radius:99px; background:var(--gold); position:absolute; bottom:4px;}
.cal-cell.today .cal-dot{background:var(--gold-soft);}

.date-strip-wrap{margin:2px -2px 0;}
.date-strip{
  display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x proximity; padding:2px 2px 8px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.date-strip::-webkit-scrollbar{display:none;}
.date-chip{
  scroll-snap-align:center; flex:0 0 auto; width:44px; height:56px; border-radius:14px;
  border:1px solid var(--line); background:var(--paper); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px; position:relative; color:var(--ink-soft);
}
.date-chip .dow{font-size:9px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; opacity:.7;}
.date-chip .dnum{font-family:var(--font-mono); font-size:15px; font-weight:700;}
.date-chip.today{border-color:var(--gold); color:var(--gold);}
.date-chip.sel{background:var(--navy); border-color:var(--navy); color:#fff;}
.date-chip .dot{position:absolute; bottom:5px; width:4px; height:4px; border-radius:99px; background:var(--gold);}
.date-chip.sel .dot{background:var(--gold-soft);}

/* Budget */
.budget-card{padding:18px; border-radius:var(--radius); background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:14px;}
.budget-title{font-weight:700; font-size:13px; color:var(--slate); text-transform:uppercase; letter-spacing:0.6px;}
.budget-bar{height:10px; border-radius:99px; background:var(--line); margin:12px 0 8px; overflow:hidden;}
.budget-bar-fill{height:100%; background:var(--gold); border-radius:99px;}
.budget-bar-fill.over{background:var(--terracotta);}
.budget-nums{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); font-weight:600;}
.budget-left{font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--navy); margin-top:4px;}

/* Investments */
.asset-total{text-align:center; padding:22px 0 6px;}
.asset-total .amt{font-family:var(--font-mono); font-size:28px; font-weight:700; color:var(--navy);}
.asset-total .lbl{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--slate); margin-top:4px;}
.asset-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--line);}
.asset-row:last-child{border-bottom:none;}
.asset-icon{width:38px; height:38px; border-radius:11px; background:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-size:17px;}
.asset-main{flex:1;}
.asset-name{font-weight:700; font-size:13.5px;}
.asset-sub{font-size:11.5px; color:var(--slate); margin-top:2px;}
.asset-val{font-family:var(--font-mono); font-weight:700; font-size:13px; text-align:right;}
.asset-change{font-size:11px; font-weight:700; margin-top:2px; text-align:right;}
.asset-change.up{color:var(--green);}
.asset-change.down{color:var(--terracotta);}

.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
  padding:10px 18px; border-radius:99px; font-size:12.5px; font-weight:700; z-index:200; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:.25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.settings-item{display:flex; align-items:center; justify-content:space-between; padding:14px; border-bottom:1px solid var(--line);}
.settings-item:last-child{border-bottom:none;}
.settings-item .t{font-weight:700; font-size:13.5px;}
.settings-item .d{font-size:11.5px; color:var(--slate); margin-top:2px;}

.drawer-overlay{
  position:fixed; inset:0; background:rgba(22,20,16,.45); z-index:120;
  display:flex; justify-content:flex-end;
  backdrop-filter:blur(2px);
}
.drawer-overlay.hidden{display:none;}
.drawer{
  width:min(86%,340px); height:100%; background:var(--cream); padding:22px 18px;
  overflow-y:auto; animation:slidein .22s ease-out; box-shadow:-10px 0 28px rgba(0,0,0,.28);
}
@keyframes slidein{from{transform:translateX(24px); opacity:.4;} to{transform:translateX(0); opacity:1;}}

.loading-dot{display:inline-block; width:6px; height:6px; border-radius:99px; background:var(--gold); animation:pulse 1s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

.streak-hero{background:var(--navy); border-radius:var(--radius); padding:20px; color:#fff; margin-bottom:16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:16px;}
.streak-hero .flame-big{font-size:40px;}
.streak-hero .num{font-family:var(--font-mono); font-size:26px; font-weight:700; color:var(--gold-soft);}
.streak-hero .txt{font-size:11.5px; color:#C8CEDC; margin-top:2px;}
.streak-days{display:flex; gap:5px; margin-top:12px;}
.streak-days .d{width:20px; height:20px; border-radius:6px; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; font-size:9px;}
.streak-days .d.hit{background:var(--gold);}

.auth-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:var(--cream);
}
.auth-screen.hidden{display:none;}
.auth-card{
  width:100%; max-width:340px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:26px 22px; text-align:center;
}
.auth-card .field{text-align:left;}
.auth-msg{font-size:12.5px; color:var(--terracotta); margin-top:12px; min-height:16px; font-weight:600;}
.auth-msg.ok{color:var(--green);}
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand-mark" style="font-size:24px;">JOANDRA</div>
    <div class="brand-sub" style="margin-bottom:22px;">Sign in to sync your data across devices</div>

    <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="you@email.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input type="password" id="authPassword" placeholder="At least 6 characters" autocomplete="current-password"></div>

    <button class="btn" id="authLoginBtn">Log in</button>
    <button class="btn ghost" id="authSignupBtn" style="margin-top:8px;">Create account</button>
    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<div id="app" class="hidden">

  <div class="topbar">
    <div class="brand">
      <div>
        <div class="brand-mark">JOANDRA</div>
        <div class="brand-sub">Money Ledger</div>
      </div>
    </div>

function mergeIntoState(parsed){

function readLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY+':'+(currentUser?currentUser.id:'anon'));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function writeLocalCache(){
  try{ localStorage.setItem(LOCAL_CACHE_KEY+':'+(currentUser?currentUser.id:'anon'), JSON.stringify(state)); }catch(e){ /* storage full or unavailable */ }
}

async function loadState(){
  // instant paint from local cache so the app never looks empty while the network call runs
  const cached = readLocalCache();
  if(cached) mergeIntoState(cached);

  if(sb && currentUser){
    try{
      const { data, error } = await sb.from('joandra_data').select('data').eq('id', currentUser.id).maybeSingle();
      if(error) throw error;
      if(data && data.data && Object.keys(data.data).length){
        mergeIntoState(data.data);
      } else {
        // first time this account logs in: seed the cloud row with current (possibly default) state
        await sb.from('joandra_data').upsert({ id: currentUser.id, data: state, updated_at: new Date().toISOString() });
      }
    }catch(e){ console.error('cloud load failed', e); showToast('⚠️ Offline — showing your last saved data'); }
  }

  loaded = true;
  applyTheme();
  ensureStreakToday(false);
  renderNav();
  renderAll();
}

let saveTimer = null;
function saveState(){
  writeLocalCache();
  clearTimeout(saveTimer);

    if(!sb || !currentUser) return;
    try{
      const { error } = await sb.from('joandra_data').upsert({ id: currentUser.id, data: state, updated_at: new Date().toISOString() });
      if(error) throw error;
    }catch(e){ console.error('save failed', e); showToast('⚠️ Saved locally — will sync when back online'); }
  }, 400);
}

function showAuthScreen(msg, ok){
  document.getElementById('authScreen').classList.remove('hidden');

  m.textContent = msg || '';

async function onLoggedIn(user){
  currentUser = user;

  document.getElementById('app').classList.remove('hidden');
  await loadState();
}
async function initAuth(){
  if(!sb){
    showAuthScreen('Supabase isn\'t configured yet. Open the file and set SUPABASE_URL / SUPABASE_ANON_KEY near the top of the <script> tag — see the comment block for setup steps.');
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(session && session.user){ await onLoggedIn(session.user); }
  else { showAuthScreen(); }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN' && session && (!currentUser || currentUser.id!==session.user.id)){ onLoggedIn(session.user); }
    if(event==='SIGNED_OUT'){ currentUser=null; location.reload(); }
  });

  document.getElementById('authLoginBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!email || !password){ showAuthScreen('Enter your email and password.'); return; }
    showAuthScreen('Logging in…');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ showAuthScreen(error.message); return; }
    await onLoggedIn(data.user);
  });
  document.getElementById('authSignupBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!email || !password || password.length<6){ showAuthScreen('Use a valid email and a password with 6+ characters.'); return; }
    showAuthScreen('Creating account…');
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ showAuthScreen(error.message); return; }
    if(data.session){ await onLoggedIn(data.user); }
    else { showAuthScreen('Account created — check your email to confirm, then log in.', true); }
  });
}

/* ================= HELPERS ================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtIDR(n){
  n = Math.round(n||0);
  const neg = n<0; n = Math.abs(n);
  return (neg?'-':'')+'Rp '+n.toLocaleString('id-ID');
}
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateShort(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* Cycle: month starts on the 25th */
function getCycleFor(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() < 25){ m -= 1; if(m<0){m=11; y-=1;} }
  const start = new Date(y,m,25);
  const end = new Date(y,m+1,24);
  return {start, end, key:`${y}-${String(m+1).padStart(2,'0')}`};
}
function inCycle(dateStr, cycle){
  const d = new Date(dateStr+'T00:00:00');
  return d>=cycle.start && d<=cycle.end;
}
function cycleLabel(cycle){
  const opts = {day:'2-digit',month:'short'};
  return `${cycle.start.toLocaleDateString('en-GB',opts)} – ${cycle.end.toLocaleDateString('en-GB',opts)} ${cycle.end.getFullYear()}`;
}
function addMonths(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth()+n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,last));
  return d.toISOString().slice(0,10);
}

/* ================= STREAK ================= */
function ensureStreakToday(save=true){
  // called on load just to render; actual increment happens on adding a transaction
  renderStreakPill();
}
function bumpStreak(){
  const today = todayStr();
  const s = state.streak;
  if(s.lastDate === today){ /* already counted today */ return; }
  if(s.lastDate){
    const y = new Date(new Date(today+'T00:00:00').getTime()-86400000).toISOString().slice(0,10);
    if(s.lastDate === y){ s.count += 1; } else { s.count = 1; }
  } else { s.count = 1; }
  s.lastDate = today;
  if(!s.log.includes(today)) s.log.push(today);
  s.log = s.log.slice(-60);
  renderStreakPill();
  saveState();
}
function renderStreakPill(){
  document.getElementById('streakCount').textContent = state.streak.count || 0;
}

/* ================= CURRENCY ================= */
const FALLBACK_RATES_TO_IDR = { USD:16300, SGD:12100, MYR:3500, AUD:10700, EUR:17700, JPY:105, GBP:20700, CNY:2250, IDR:1 };
async function getRateToIDR(code){
  code = code.toUpperCase();
  if(code==='IDR') return 1;
  const cached = state.rates[code];
  const today = todayStr();
  if(cached && cached.date===today) return cached.rate;
  try{
    const res = await fetch(`https://api.frankfurter.app/latest?from=${code}&to=IDR`);
    const data = await res.json();
    const rate = data.rates && data.rates.IDR;
    if(rate){
      state.rates[code] = {rate, date:today};
      saveState();
      return rate;
    }
  }catch(e){ /* offline or unsupported code, fall back */ }
  return (FALLBACK_RATES_TO_IDR[code]) || null;
}

function calcPress(k){
  const disp = document.getElementById('calcDisplay');
  if(k==='C'){ calcState.expr=''; }
  else if(k==='del'){ calcState.expr = calcState.expr.slice(0,-1); }
  else if(k==='='){
    try{
      const val = evalSimpleExpr(calcState.expr);
      calcState.expr = String(Math.round(val*100)/100);
    }catch(e){ /* ignore invalid expr */ }
  } else {
    calcState.expr += k;
  }
  disp.textContent = calcState.expr || '0';
}
// Safe left-to-right evaluator supporting + - * / with decimals
function evalSimpleExpr(expr){
  const tokens = expr.match(/(\d+\.?\d*)|[+\-*/]/g);
  if(!tokens || !tokens.length) return 0;
  let result = parseFloat(tokens[0])||0;
  for(let i=1;i<tokens.length;i+=2){
    const op = tokens[i], next = parseFloat(tokens[i+1]);
    if(next===undefined || isNaN(next)) break;
    if(op==='+') result += next;
    else if(op==='-') result -= next;
    else if(op==='*') result *= next;
    else if(op==='/') result = next!==0? result/next : result;
  }
  return result;
}

  const wrap = document.getElementById('catChips');
  const list = state.categories[type];
  wrap.innerHTML = list.map(c=>`<button type="button" class="chip ${c===selected?'on':''}" data-cat="${escapeHTML(c)}">${CATEGORY_ICONS[c]||''} ${c}</button>`).join('') + `<button type="button" class="chip add" id="addCatChip">+ New</button>`;

async function saveTransaction(){
  const name = document.getElementById('tName').value.trim();
  const date = document.getElementById('tDate').value || todayStr();
  const currency = document.getElementById('tCurrency').value;
  const catBtn = document.querySelector('#catChips .chip.on[data-cat]');
  const acctBtn = document.querySelector('#acctChips .chip.on[data-acct]');
  const note = document.getElementById('tNote').value.trim();
  const type = window._currentTxType ? window._currentTxType() : (editingTx?editingTx.type:'expense');

  if(!name){ showToast('⚠️ Please name this transaction'); return; }
  if(!catBtn){ showToast('⚠️ Please choose a category'); return; }

  const rawAmount = parseFloat(calcState.expr) || evalSimpleExpr(calcState.expr) || 0;
  if(!rawAmount || rawAmount<=0){ showToast('⚠️ Enter an amount'); return; }

  let amountIDR = rawAmount;
  if(currency!=='IDR'){
    showToast('Converting currency…');
    const rate = await getRateToIDR(currency);
    if(rate) amountIDR = Math.round(rawAmount*rate);
  }

  const category = catBtn.dataset.cat;
  const account = acctBtn ? acctBtn.dataset.acct : '';

  if(installmentOn && !editingTx){
    const total = parseFloat(document.getElementById('instTotal').value);
    const months = parseInt(document.getElementById('instMonths').value);
    if(!total || !months || months<1){ showToast('⚠️ Enter installment total & months'); return; }
    let totalIDR = total;
    if(currency!=='IDR'){ const rate = await getRateToIDR(currency); if(rate) totalIDR = Math.round(total*rate); }
    const monthly = Math.round(totalIDR/months);
    const groupId = uid();
    for(let i=0;i<months;i++){
      state.transactions.push({
        id: uid(), type:'expense', name, amount: i===months-1? (totalIDR - monthly*(months-1)) : monthly,
        currency:'IDR', origAmount:null, date: addMonths(date,i), category, account, note,
        installmentId: groupId, installmentIndex:i+1, installmentTotal:months, createdAt: Date.now()+i
      });
    }
    bumpStreak();
    saveState(); closeSheet(); renderAll();
    showToast(`Installment set for ${months} months`);
    return;
  }

  if(editingTx){
    editingTx.name=name; editingTx.date=date; editingTx.amount=amountIDR; editingTx.currency=currency;
    editingTx.category=category; editingTx.account=account; editingTx.note=note; editingTx.type=type;
  } else {
    state.transactions.push({
      id: uid(), type, name, amount: amountIDR, currency, origAmount: currency!=='IDR'?rawAmount:null,
      date, category, account, note, createdAt: Date.now()
    });
  }
  bumpStreak();
  saveState(); closeSheet(); renderAll();
  showToast(editingTx? 'Transaction updated' : 'Transaction added');
}

/* ================= CHARTS TAB ================= */
let chartCycleOffset = 0;
let chartMode = 'expense';
function buildDonutSVG(catList, totals, grand){
  const size = 200, stroke = 28, r = (size-stroke)/2, c = 2*Math.PI*r;
  const cx = size/2, cy = size/2;
  if(!catList.length){
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="${stroke}"></circle>
    </svg>`;
  }
  let offset = 0;
  const segs = catList.map((cat,i)=>{
    const val = totals[cat];
    const frac = grand? val/grand : 0;
    const dash = Math.max(frac*c - (catList.length>1?1.5:0), 0); // small gap between segments
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CATEGORY_COLORS[i%CATEGORY_COLORS.length]}" stroke-width="${stroke}" stroke-linecap="butt" stroke-dasharray="${dash} ${Math.max(c-dash,0)}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${escapeHTML(cat)} — ${Math.round(frac*100)}%</title></circle>`;
    offset += frac*c;
    return seg;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}</svg>`;
}
function renderCharts(){
  const el = document.getElementById('view-charts');
  // Start from this cycle's midpoint date, shift by whole months, then resolve the cycle it falls in.
  let refDate = getCycleFor(todayStr()).start.toISOString().slice(0,10);
  refDate = addMonths(refDate, chartCycleOffset);
  const midDate = new Date(refDate+'T00:00:00'); midDate.setDate(midDate.getDate()+15);
  const cycle = getCycleFor(midDate.toISOString().slice(0,10));

  const txs = state.transactions.filter(t=>inCycle(t.date, cycle) && t.type===chartMode);
  const totals = {};
  txs.forEach(t=>{ totals[t.category] = (totals[t.category]||0) + t.amount; });
  const catList = Object.keys(totals).sort((a,b)=>totals[b]-totals[a]);
  const grand = catList.reduce((s,c)=>s+totals[c],0);

  const cycleIncome = state.transactions.filter(t=>t.type==='income' && inCycle(t.date,cycle)).reduce((s,t)=>s+t.amount,0);
  const cycleExpense = state.transactions.filter(t=>t.type==='expense' && inCycle(t.date,cycle)).reduce((s,t)=>s+t.amount,0);
  const netBalance = cycleIncome - cycleExpense;

  el.innerHTML = `
    <div class="section-title">${t('reports')}</div>
    <div class="tabbar">
      <button id="modeExpense" class="${chartMode==='expense'?'on':''}">${t('expense')}</button>
      <button id="modeIncome" class="${chartMode==='income'?'on':''}">${t('income')}</button>
    </div>
    <div class="cal-head">
      <button class="icon-btn" id="cyclePrev">‹</button>
      <div class="m" style="font-size:14px">${cycleLabel(cycle)}</div>
      <button class="icon-btn" id="cycleNext">›</button>
    </div>

    <div class="budget-card" style="text-align:center; padding:16px;">
      <div class="budget-title">Net balance this cycle</div>
      <div style="font-family:var(--font-mono); font-size:24px; font-weight:700; margin-top:6px; color:${netBalance>=0?'var(--green)':'var(--terracotta)'}">${netBalance>=0?'+':'-'}${fmtIDR(Math.abs(netBalance))}</div>
      <div style="font-size:11.5px; color:var(--slate); margin-top:6px; font-weight:600;">${fmtIDR(cycleIncome)} ${t('income').toLowerCase()} &nbsp;−&nbsp; ${fmtIDR(cycleExpense)} ${t('expense').toLowerCase()}</div>
    </div>

    <div class="chart-wrap" id="chartWrap">
      <div class="chart-center"><div class="amt">${fmtIDR(grand)}</div><div class="lbl">${chartMode==='expense'?t('expense'):t('income')}</div></div>
    </div>
    <div class="card" id="catBreakdown" style="margin-top:16px;"></div>
    <button class="btn ghost" id="exportPdfBtn" style="margin-top:18px;">${t('export_pdf')}</button>
  `;

  document.getElementById('chartWrap').insertAdjacentHTML('afterbegin', buildDonutSVG(catList, totals, grand));

  const bEl = document.getElementById('catBreakdown');
  bEl.innerHTML = catList.length? catList.map((c,i)=>{
    const pct = grand? Math.round(totals[c]/grand*100) : 0;
    return `<div class="cat-row" data-cat-view="${escapeHTML(c)}" style="cursor:pointer">
      <div class="cat-dot" style="background:${CATEGORY_COLORS[i%CATEGORY_COLORS.length]}"></div>
      <div class="cat-row-main"><div class="cat-row-name">${CATEGORY_ICONS[c]||''} ${c}</div><div class="cat-row-pct">${pct}% of total</div></div>
      <div class="cat-row-amt">${fmtIDR(totals[c])}</div>
    </div>`;
  }).join('') : `<div class="empty-state">${t('no_records').replace('{mode}', chartMode==='expense'?t('expense').toLowerCase():t('income').toLowerCase())}</div>`;

  bEl.querySelectorAll('[data-cat-view]').forEach(row=>row.addEventListener('click', ()=>{
    openCategoryListModal(row.dataset.catView, chartMode, cycle);
  }));

  document.getElementById('modeExpense').addEventListener('click', ()=>{ chartMode='expense'; renderCharts(); });
  document.getElementById('modeIncome').addEventListener('click', ()=>{ chartMode='income'; renderCharts(); });
  document.getElementById('cyclePrev').addEventListener('click', ()=>{ chartCycleOffset -= 1; renderChartsWithOffset(); });
  document.getElementById('cycleNext').addEventListener('click', ()=>{ chartCycleOffset += 1; renderChartsWithOffset(); });
  document.getElementById('exportPdfBtn').addEventListener('click', ()=>exportReportPDF(cycle, chartMode, totals, grand));
}
function renderChartsWithOffset(){ renderCharts(); }

function openCategoryListModal(cat, type, cycle){
  const txs = state.transactions.filter(t=>t.category===cat && t.type===type && inCycle(t.date,cycle)).sort((a,b)=>b.date.localeCompare(a.date));
  const html = `
    <div class="sheet-title">${CATEGORY_ICONS[cat]||''} ${cat}</div>
    <div class="card">${txs.map(txRowHTML).join('') || '<div class="empty-state">No transactions</div>'}</div>
  `;
  openSheet(html);
  document.querySelectorAll('[data-tx]').forEach(r=>r.addEventListener('click', ()=>openTransactionModal(r.dataset.tx)));
}

/* ================= TASKS TAB (todo + calendar) ================= */
let taskTab = 'todo';
let calMonth = new Date();
let selectedTodoDate = todayStr();
function dateStripRange(){
  const arr = [];
  for(let i=-30;i<=45;i++) arr.push(new Date(Date.now()+i*86400000).toISOString().slice(0,10));
  return arr;
}
function todosForDate(dateStr){
  const today = todayStr();
  if(dateStr < today){
    return state.todos.filter(x=> x.done && x.completedDate===dateStr);
  }
  return state.todos.filter(x=> x.deadline===dateStr);
}
function renderTasks(){
  const el = document.getElementById('view-tasks');
  el.innerHTML = `
    <div class="section-title">${t('tasks_events')}</div>
    <div class="tabbar">
      <button id="taskTabTodo" class="${taskTab==='todo'?'on':''}">${t('todo_list')}</button>
      <button id="taskTabCal" class="${taskTab==='cal'?'on':''}">${t('events_calendar')}</button>
    </div>
    <div id="taskContent"></div>
  `;
  document.getElementById('taskTabTodo').addEventListener('click', ()=>{ taskTab='todo'; renderTasks(); });
  document.getElementById('taskTabCal').addEventListener('click', ()=>{ taskTab='cal'; renderTasks(); });

  const content = document.getElementById('taskContent');
  if(taskTab==='todo'){
    const today = todayStr();
    const dates = dateStripRange();
    const dowFmt = new Intl.DateTimeFormat(state.settings.language==='id'?'id-ID':'en-GB', {weekday:'short'});
    const list = todosForDate(selectedTodoDate);
    const isPast = selectedTodoDate < today;
    const isFuture = selectedTodoDate > today;
    const dateHeading = selectedTodoDate===today ? 'Today' : new Date(selectedTodoDate+'T00:00:00').toLocaleDateString(state.settings.language==='id'?'id-ID':'en-GB',{weekday:'long', day:'numeric', month:'long'});
    const contextLine = isPast ? 'Completed on this day' : (isFuture ? 'Due on this day' : 'Due today');

    content.innerHTML = `
      <button class="btn" id="addTodoBtn" style="margin-bottom:14px;">${t('add_todo')}</button>
      <div class="date-strip-wrap">
        <div class="date-strip" id="dateStrip">
          ${dates.map(d=>{
            const dn = new Date(d+'T00:00:00');
            const hasItems = todosForDate(d).length>0;
            return `<button type="button" class="date-chip ${d===selectedTodoDate?'sel':''} ${d===today?'today':''}" data-date="${d}">
              <span class="dow">${dowFmt.format(dn)}</span><span class="dnum">${dn.getDate()}</span>${hasItems?'<span class="dot"></span>':''}
            </button>`;
          }).join('')}

      <div class="card">${list.length? list.map(todoRowHTML).join('') : `<div class="empty-state">${t('no_tasks')}</div>`}</div>
    `;
    document.getElementById('addTodoBtn').addEventListener('click', ()=>openTodoModal());

          <button class="icon-btn" id="calPrev">‹</button>
          <div class="m">${calMonth.toLocaleDateString(state.settings.language==='id'?'id-ID':'en-GB',{month:'long', year:'numeric'})}</div>
          <button class="icon-btn" id="calNext">›</button>

      </div>

      <div class="card" id="eventListAll"></div>
    `;
    document.getElementById('addEventBtn').addEventListener('click', ()=>openEventModal());
    document.getElementById('calPrev').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderTasks(); });
    document.getElementById('calNext').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderTasks(); });
    renderCalendarGrid();
    const allEv = [...state.events].sort((a,b)=>a.date.localeCompare(b.date));
    document.getElementById('eventListAll').innerHTML = allEv.length? allEv.map(eventRowHTML).join('') : `<div class="empty-state">${t('no_events_yet')}</div>`;

function renderCalendarGrid(){
  const grid = document.getElementById('calGrid');
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = todayStr();
  const eventDates = new Set(state.events.map(e=>e.date));
  let html = ['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++) html += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds===today;
    html += `<div class="cal-cell ${isToday?'today':''}">${d}${eventDates.has(ds)?'<div class="cal-dot"></div>':''}</div>`;
  }
  grid.innerHTML = html;
}

/* ================= BUDGET TAB ================= */
function renderBudget(){
  const el = document.getElementById('view-budget');
  const cycle = getCycleFor(todayStr());
  const monthExpense = state.transactions.filter(t=>t.type==='expense' && inCycle(t.date,cycle)).reduce((s,t)=>s+t.amount,0);
  const todayExpense = state.transactions.filter(t=>t.type==='expense' && t.date===todayStr()).reduce((s,t)=>s+t.amount,0);

  const monthly = state.budget.monthly||0;
  const daily = state.budget.daily||0;
  const monthLeft = monthly - monthExpense;
  const dayLeft = daily - todayExpense;
  const monthPct = monthly? Math.min(100, Math.round(monthExpense/monthly*100)) : 0;
  const dayPct = daily? Math.min(100, Math.round(todayExpense/daily*100)) : 0;

  el.innerHTML = `
    <div class="section-title">${t('budget_planner')} <span class="link" id="editBudgetLink">${t('edit')}</span></div>

    <div class="budget-card">
      <div class="budget-title">${t('monthly_budget')} (${cycleLabel(cycle)})</div>
      <div class="budget-left">${monthly? fmtIDR(monthLeft) : t('not_set')}</div>
      ${monthly?`<div class="budget-bar"><div class="budget-bar-fill ${monthLeft<0?'over':''}" style="width:${monthPct}%"></div></div>
      <div class="budget-nums"><span>${fmtIDR(monthExpense)}</span><span>${fmtIDR(monthly)}</span></div>`:''}
    </div>

    <div class="budget-card">
      <div class="budget-title">${t('today_budget')}</div>
      <div class="budget-left">${daily? fmtIDR(dayLeft) : t('not_set')}</div>
      ${daily?`<div class="budget-bar"><div class="budget-bar-fill ${dayLeft<0?'over':''}" style="width:${dayPct}%"></div></div>
      <div class="budget-nums"><span>${fmtIDR(todayExpense)}</span><span>${fmtIDR(daily)}</span></div>`:''}
    </div>

    <div class="section-title">${t('streak')}</div>
    <div class="streak-hero">
      <div class="flame-big">🔥</div>
      <div>
        <div class="num">${state.streak.count||0} day${state.streak.count===1?'':'s'}</div>
        <div class="txt">${t('keep_streak')}</div>
        <div class="streak-days">${last7Days().map(d=>`<div class="d ${state.streak.log.includes(d)?'hit':''}">${new Date(d+'T00:00:00').getDate()}</div>`).join('')}</div>
      </div>
    </div>
  `;
  document.getElementById('editBudgetLink').addEventListener('click', openBudgetModal);
}
function last7Days(){
  const arr = [];
  for(let i=6;i>=0;i--){ arr.push(new Date(Date.now()-i*86400000).toISOString().slice(0,10)); }
  return arr;
}
function openBudgetModal(){

/* ================= INVEST TAB ================= */
const INVEST_KINDS = {
  gold:{label:'Gold', icon:'🪙'}, forex:{label:'Forex', icon:'💱'}, crypto:{label:'Crypto', icon:'₿'},
  saham:{label:'Saham (Stocks)', icon:'📊'}, reksadana:{label:'Reksa Dana', icon:'🧺'}, other:{label:'Other asset', icon:'💎'}
};
async function renderInvest(){
  const el = document.getElementById('view-invest');
  const total = state.investments.reduce((s,a)=>s+(a.currentValue||0),0);
  el.innerHTML = `
    <div class="asset-total"><div class="amt">${fmtIDR(total)}</div><div class="lbl">${t('total_assets')}</div></div>
    <div class="btn-row" style="margin:14px 0 18px;">

    </div>

  `;
  document.getElementById('addInvestBtn').addEventListener('click', openInvestModal);
  document.getElementById('refreshPricesBtn').addEventListener('click', refreshLivePrices);
  const listEl = document.getElementById('investList');
  listEl.innerHTML = state.investments.length? state.investments.map(assetRowHTML).join('') : `<div class="empty-state">${t('no_investments')}</div>`;
  listEl.querySelectorAll('[data-inv]').forEach(r=>r.addEventListener('click', ()=>openInvestModal(r.dataset.inv)));
}
function assetRowHTML(a){
  const k = INVEST_KINDS[a.kind]||INVEST_KINDS.other;
  const change = a.buyValue ? Math.round((a.currentValue - a.buyValue)/a.buyValue*100) : null;
  return `<div class="asset-row" data-inv="${a.id}" style="cursor:pointer">
    <div class="asset-icon">${k.icon}</div>
    <div class="asset-main">
      <div class="asset-name">${escapeHTML(a.name)}</div>
      <div class="asset-sub">${k.label}${a.qty?` · ${a.qty} ${a.unit||''}`:''}${a.lastUpdated?' · updated '+fmtDateShort(a.lastUpdated):''}</div>
    </div>
    <div>
      <div class="asset-val">${fmtIDR(a.currentValue)}</div>
      ${change!==null?`<div class="asset-change ${change>=0?'up':'down'}">${change>=0?'▲':'▼'} ${Math.abs(change)}%</div>`:''}
    </div>
  </div>`;
}
function openInvestModal(id){
  const a = id ? state.investments.find(x=>x.id===id) : null;
  const html = `
    <div class="sheet-title">${a?'Edit investment':'New investment'}</div>
    <div class="field"><label>Type</label>
      <select id="invKind">${Object.keys(INVEST_KINDS).map(k=>`<option value="${k}" ${a&&a.kind===k?'selected':''}>${INVEST_KINDS[k].icon} ${INVEST_KINDS[k].label}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Name</label><input type="text" id="invName" placeholder="e.g. Antam Gold 10g, BTC, BBCA" value="${a?escapeHTML(a.name):''}"></div>
    <div class="row-2">
      <div class="field"><label>Quantity</label><input type="number" id="invQty" placeholder="e.g. 10" value="${a?a.qty||'':''}"></div>
      <div class="field"><label>Unit</label><input type="text" id="invUnit" placeholder="gram / coin / lot" value="${a?a.unit||'':''}"></div>
    </div>
    <div class="field"><label>Reference code <span style="text-transform:none;color:var(--slate)">(CoinGecko id for crypto e.g. "bitcoin", or currency code for forex e.g. "USD")</span></label><input type="text" id="invRef" placeholder="optional, for auto-update" value="${a?a.ref||'':''}"></div>
    <div class="row-2">
      <div class="field"><label>Purchase value (IDR)</label><input type="number" id="invBuy" placeholder="Total cost when bought" value="${a?a.buyValue||'':''}"></div>
      <div class="field"><label>Current value (IDR)</label><input type="number" id="invCurrent" placeholder="Current total value" value="${a?a.currentValue||'':''}"></div>
    </div>
    <button class="btn" id="saveInvestBtn">${a?'Save changes':'Add investment'}</button>
    ${a?`<button class="btn secondary" id="deleteInvestBtn">Delete investment</button>`:''}
  `;
  openSheet(html);
  document.getElementById('saveInvestBtn').addEventListener('click', ()=>{
    const kind = document.getElementById('invKind').value;
    const name = document.getElementById('invName').value.trim();
    const qty = parseFloat(document.getElementById('invQty').value)||0;
    const unit = document.getElementById('invUnit').value.trim();
    const ref = document.getElementById('invRef').value.trim();
    const buyValue = parseFloat(document.getElementById('invBuy').value)||0;
    const currentValue = parseFloat(document.getElementById('invCurrent').value)||0;
    if(!name){ showToast('⚠️ Enter a name'); return; }
    if(a){
      Object.assign(a,{kind,name,qty,unit,ref,buyValue,currentValue,lastUpdated:todayStr()});
    } else {
      state.investments.push({id:uid(), kind, name, qty, unit, ref, buyValue, currentValue, lastUpdated:todayStr()});
    }
    saveState(); closeSheet(); renderInvest(); showToast('Investment saved');
  });
  if(a){
    document.getElementById('deleteInvestBtn').addEventListener('click', ()=>{
      state.investments = state.investments.filter(x=>x.id!==a.id);
      saveState(); closeSheet(); renderInvest(); showToast('Investment removed');
    });
  }
}
async function refreshLivePrices(){
  showToast('Fetching live prices…');
  let updated = 0;
  for(const a of state.investments){
    try{
      if(a.kind==='forex' && a.ref){
        const rate = await getRateToIDR(a.ref);
        if(rate && a.qty){ a.currentValue = Math.round(a.qty*rate); a.lastUpdated = todayStr(); updated++; }
      } else if(a.kind==='crypto' && a.ref){
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${encodeURIComponent(a.ref)}&vs_currencies=idr`);
        const data = await res.json();
        const price = data[a.ref] && data[a.ref].idr;
        if(price && a.qty){ a.currentValue = Math.round(a.qty*price); a.lastUpdated = todayStr(); updated++; }
      } else if(a.kind==='gold'){
        try{
          const res = await fetch('https://api.gold-api.com/price/XAU');
          const data = await res.json();
          if(data && data.price){
            const usdToIdr = await getRateToIDR('USD');
            const pricePerGramIDR = (data.price/31.1035)*usdToIdr;
            if(a.qty){ a.currentValue = Math.round(a.qty*pricePerGramIDR); a.lastUpdated = todayStr(); updated++; }
          }
        }catch(e){ /* gold API unavailable, skip silently */ }
      }
    }catch(e){ /* keep manual value on failure */ }
  }
  saveState(); renderInvest();
  showToast(updated? `Updated ${updated} asset${updated===1?'':'s'}` : 'Live update unavailable — values kept as entered');
}

function downloadJSONBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `joandra-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

function exportReportPDF(cycle, mode, totals, grand){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('JOANDRA', 14, 18);
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text(`${mode.charAt(0).toUpperCase()+mode.slice(1)} report — cycle ${cycleLabel(cycle)}`, 14, 26);
  doc.setDrawColor(220); doc.line(14,30,196,30);
  let y = 40;
  doc.setFont('helvetica','bold'); doc.text('Category', 14, y); doc.text('Amount (IDR)', 150, y);
  doc.setFont('helvetica','normal'); y+=6;
  Object.keys(totals).sort((a,b)=>totals[b]-totals[a]).forEach(c=>{
    doc.text(c, 14, y); doc.text(fmtIDR(totals[c]), 150, y); y+=7;
    if(y>270){ doc.addPage(); y=20; }
  });
  doc.setDrawColor(220); doc.line(14,y,196,y); y+=8;
  doc.setFont('helvetica','bold'); doc.text('Total', 14, y); doc.text(fmtIDR(grand), 150, y);
  doc.save(`joandra-${mode}-${cycle.key}.pdf`);
  if(navigator.share){
    // offer share as well, non-blocking
  }
  showToast('PDF exported');
}
function exportFullPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const cycle = getCycleFor(todayStr());
  const inc = state.transactions.filter(t=>t.type==='income'&&inCycle(t.date,cycle)).reduce((s,t)=>s+t.amount,0);
  const exp = state.transactions.filter(t=>t.type==='expense'&&inCycle(t.date,cycle)).reduce((s,t)=>s+t.amount,0);
  const assets = state.investments.reduce((s,a)=>s+(a.currentValue||0),0);
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text('JOANDRA — Full Report', 14, 18);
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text(`Cycle ${cycleLabel(cycle)}`, 14, 26);
  doc.line(14,30,196,30);
  let y=40;
  doc.setFont('helvetica','bold'); doc.text('Summary', 14, y); y+=8; doc.setFont('helvetica','normal');
  doc.text(`Total income: ${fmtIDR(inc)}`, 14, y); y+=7;
  doc.text(`Total expense: ${fmtIDR(exp)}`, 14, y); y+=7;
  doc.text(`Net: ${fmtIDR(inc-exp)}`, 14, y); y+=7;
  doc.text(`Total assets: ${fmtIDR(assets)}`, 14, y); y+=12;

  doc.setFont('helvetica','bold'); doc.text('Recent transactions', 14, y); y+=8; doc.setFont('helvetica','normal');
  [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).forEach(t=>{
    doc.setFontSize(9);
    doc.text(`${t.date}  ${t.type==='income'?'+':'-'}${fmtIDR(t.amount)}  ${t.name} (${t.category})`, 14, y);
    y+=6; if(y>280){ doc.addPage(); y=20; }
  });
  doc.save(`joandra-full-report-${todayStr()}.pdf`);
  showToast('Full report PDF exported');
}
